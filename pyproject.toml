[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veltrix-peopleops-assistant"
version = "0.1.0"
description = "Document ingestion and retrieval for the Veltrix PeopleOps assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "tiktoken>=0.7,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
veltrix-ingest = "veltrix_assistant.ingestion.cli:main"
veltrix-api = "veltrix_assistant.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.14,<3",
    "pytest>=8,<9",
]
