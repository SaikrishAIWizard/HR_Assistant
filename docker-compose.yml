services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      CORPUS_DIR: /app/data/corpus
      MANIFEST_PATH: /app/data/manifest.json
      DB_PATH: /app/data/veltrix.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_TODAY: ${APP_TODAY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      TESSERACT_CMD: ${TESSERACT_CMD:-}
      HYBRID_RETRIEVAL_ENABLED: ${HYBRID_RETRIEVAL_ENABLED:-true}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      VECTOR_STORE: ${VECTOR_STORE:-chroma}
      VECTOR_DB_PATH: /app/data/vector_db
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-hashing-384}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-20}
      BM25_TOP_K: ${BM25_TOP_K:-10}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-10}
      HYBRID_TOP_K: ${HYBRID_TOP_K:-10}
      RRF_K: ${RRF_K:-60}
      PII_REDACTION_ENABLED: ${PII_REDACTION_ENABLED:-true}
      PII_REDACTION_MODE: ${PII_REDACTION_MODE:-redact}
      PII_SENSITIVE_TERMS: ${PII_SENSITIVE_TERMS:-}
      PROVENANCE_ENABLED: ${PROVENANCE_ENABLED:-true}
      PROVENANCE_VERSION: ${PROVENANCE_VERSION:-2}
      PROVENANCE_PSEUDONYM_KEY: ${PROVENANCE_PSEUDONYM_KEY:-}
      LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-true}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 110
      start_period: 10s
    restart: unless-stopped
